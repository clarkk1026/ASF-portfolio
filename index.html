<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>

		<!-- Google Fonts -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>

		<!-- Brand favicon -->
		<link
			rel="icon"
			type="image/png"
			href="/ben-logo.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/ben-logo.png"
		/>

		<!-- Legacy PNG favicons -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/dark/favicon-16x16.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/dark/favicon-32x32.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/dark/apple-touch-icon.png"
			media="(prefers-color-scheme: dark)"
		/>

		<!-- Light Mode Icons -->
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/light/favicon-16x16.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/light/favicon-32x32.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/light/apple-touch-icon.png"
			media="(prefers-color-scheme: light)"
		/>

		<!-- Primary Meta Tags -->
		<title>Ben Clark | AI Engineer • Shopify Developer • Full-Stack Developer</title>
		<meta
			name="title"
			content="Ben Clark | AI Engineer • Shopify Developer • Full-Stack Developer"
		/>
		<meta
			name="description"
			content="Ben Clark — AI Engineer, Shopify Developer, and Full-Stack Developer building scalable products with AI and modern web technologies."
		/>

		<!-- Open Graph / Facebook -->
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:title"
			content="Ben Clark | AI Engineer • Shopify Developer • Full-Stack Developer"
		/>
		<meta
			property="og:description"
			content="Building products that solve real business problems with AI, Shopify, and modern full-stack technologies."
		/>

		<!-- Twitter -->
		<meta
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta
			name="twitter:title"
			content="Ben Clark | AI Engineer • Shopify Developer • Full-Stack Developer"
		/>
		<meta
			name="twitter:description"
			content="AI Engineer, Shopify Developer, and Full-Stack Developer building scalable products people actually use."
		/>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"
		></script>
	</body>
</html>
