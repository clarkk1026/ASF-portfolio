<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>

		<!-- Google Fonts -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>

		<!-- Brand favicon -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon-mark.svg"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/favicons/favicon-16x16.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="/favicons/favicon-48x48.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="/favicons/favicon-192x192.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/favicons/favicon-180x180.png"
		/>

		<!-- Primary Meta Tags -->
		<title>Ben Clark | AI Developer | Shopify Developer | Full Stack Engineer</title>
		<meta
			name="title"
			content="Ben Clark | AI Developer | Shopify Developer | Full Stack Engineer"
		/>
		<meta
			name="description"
			content="Ben Clark is an AI Developer, Shopify Developer, and Full Stack Engineer building scalable products with AI, Shopify, and modern web technologies."
		/>

		<!-- Open Graph / Facebook -->
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:title"
			content="Ben Clark | AI Developer | Shopify Developer | Full Stack Engineer"
		/>
		<meta
			property="og:description"
			content="Building products that solve real business problems with AI, Shopify, and modern full-stack technologies."
		/>
		<meta
			property="og:image"
			content="/favicons/favicon-192x192.png"
		/>

		<!-- Twitter -->
		<meta
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta
			name="twitter:title"
			content="Ben Clark | AI Developer | Shopify Developer | Full Stack Engineer"
		/>
		<meta
			name="twitter:description"
			content="AI Developer, Shopify Developer, and Full Stack Engineer building scalable products people actually use."
		/>
		<meta
			name="twitter:image"
			content="/favicons/favicon-192x192.png"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"
		></script>
	</body>
</html>
